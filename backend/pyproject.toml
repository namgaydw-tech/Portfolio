[project]
name = "namgay-portfolio-api"
version = "1.0.0"
description = "FastAPI contact service for Namgay D. Wangchuk's portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "starlette==1.10.0",
    "anyio==4.15.1",
    "pydantic[email]==2.11.9",
    "python-dotenv==1.1.1",
    "vercel==0.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

